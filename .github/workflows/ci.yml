name: CI / CD

'on':
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ftp_admin
          POSTGRES_PASSWORD: localpassword
          POSTGRES_DB: finetuning
        ports:
          - '5432:5432'
        options: '--health-cmd pg_isready --health-interval 10s --health-timeout 5s
          --health-retries 5'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        # heulistic-axolotl is not on PyPI yet; the API imports it for config
        # validation, so it is installed from the monorepo.
        run: |
          pip install -r api/requirements.txt
          pip install ./packages/heulistic-axolotl
      - name: Run tests
        working-directory: api
        env:
          DATABASE_URL: postgresql+asyncpg://ftp_admin:localpassword@localhost:5432/finetuning
          S3_BUCKET: test-bucket
          LOCAL_MODE: 'false'
          FRONTEND_URL: http://localhost:3000
          STRIPE_SECRET_KEY: sk_test_dummy
          STRIPE_WEBHOOK_SECRET: whsec_dummy
          MAX_DATASET_SIZE_MB: '10'
        run: pytest

  scheduler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r scheduler/requirements.txt pytest
      - name: Run tests
        working-directory: scheduler
        run: pytest

  training:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install -r training/requirements.txt pytest
          pip install ./packages/heulistic-axolotl
      - name: Run tests
        working-directory: training
        run: pytest

  heulistic-axolotl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pytest pyyaml
      - name: Run tests
        working-directory: packages/heulistic-axolotl
        run: pytest

  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        # heulistic-axolotl is not on PyPI yet, so it is installed from the
        # monorepo; pytest.ini_options adds it to the path for the test run.
        run: pip install pytest pyyaml 'typer>=0.12'
      - name: Run tests
        working-directory: cli
        run: pytest

  # Build the images on every push, not only on release tags. Two releases have
  # now failed at the image build — a missing reference file, then a missing
  # empty directory — both of which built fine locally and only broke from a
  # clean checkout. Training is excluded: it is many GB and needs the
  # free-disk-space dance, so it stays on the tag path.
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build api (root context, for packages/heulistic-axolotl)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./api/Dockerfile
          push: false
      - name: Build scheduler
        uses: docker/build-push-action@v6
        with:
          context: ./scheduler
          push: false
      - name: Build frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
      - name: Build frontend-local
        uses: docker/build-push-action@v6
        with:
          context: ./frontend-local
          push: false

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Run tests
        working-directory: frontend
        run: npm run test

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - api
      - scheduler
      - training
      - frontend
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/ftp-prod-github-ci
          aws-region: us-east-1

      - name: Log in to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push images
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          SHA: ${{ github.sha }}
        run: |
          for SERVICE in api scheduler training; do
            REPO="$REGISTRY/ftp-prod/$SERVICE"
            # api and training build from the repo root to install packages/heulistic-axolotl
            if [ "$SERVICE" = "api" ] || [ "$SERVICE" = "training" ]; then
              docker build -f "./$SERVICE/Dockerfile" -t "$REPO:$SHA" -t "$REPO:latest" .
            else
              docker build -t "$REPO:$SHA" -t "$REPO:latest" "./$SERVICE"
            fi
            docker push "$REPO:$SHA"
            docker push "$REPO:latest"
          done

      - name: Redeploy API
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters 'Name=tag:Name,Values=ftp-prod-api' 'Name=instance-state-name,Values=running' \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)
          CMD_ID=$(aws ssm send-command \
            --region us-east-1 \
            --instance-ids "$INSTANCE_ID" \
            --document-name 'AWS-RunShellScript' \
            --parameters 'commands=["bash /opt/reload.sh"]' \
            --timeout-seconds 120 \
            --query Command.CommandId --output text)
          aws ssm wait command-executed \
            --command-id "$CMD_ID" --instance-id "$INSTANCE_ID"
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StatusDetails --output text)
          echo "API deploy status: $STATUS"
          [ "$STATUS" = "Success" ]

      - name: Redeploy Scheduler
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters 'Name=tag:Name,Values=ftp-prod-scheduler' 'Name=instance-state-name,Values=running' \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)
          CMD_ID=$(aws ssm send-command \
            --region us-east-1 \
            --instance-ids "$INSTANCE_ID" \
            --document-name 'AWS-RunShellScript' \
            --parameters 'commands=["bash /opt/reload.sh"]' \
            --timeout-seconds 120 \
            --query Command.CommandId --output text)
          aws ssm wait command-executed \
            --command-id "$CMD_ID" --instance-id "$INSTANCE_ID"
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StatusDetails --output text)
          echo "Scheduler deploy status: $STATUS"
          [ "$STATUS" = "Success" ]