services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - AWS_PROFILE=heulistic-mndiong
    volumes:
      - ${HOME}/.aws:/root/.aws:ro
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15
    environment:
      POSTGRES_DB: finetuning
      POSTGRES_USER: ftp_admin
      POSTGRES_PASSWORD: localpassword
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ftp_admin -d finetuning"]
      interval: 5s
      timeout: 5s
      retries: 5
