[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "heulistic-axolotl"
version = "0.1.1"
description = "Axolotl config schema and validation, shared by the Heulistic CLI and API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Heulistic", email = "hello@heulistic.com" }]
keywords = ["axolotl", "llm", "fine-tuning", "validation", "schema"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://heulistic.com"

[tool.hatch.build.targets.wheel]
packages = ["src/heulistic_axolotl"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
