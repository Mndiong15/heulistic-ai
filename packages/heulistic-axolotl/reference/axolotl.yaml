# Axolotl configuration reference — vendored verbatim from upstream.
#
# Source      : https://docs.axolotl.ai/docs/config-reference.html
# Spot-checked: 2026-09-05 (field order, types and defaults matched upstream)
#
# Do not hand-edit. To refresh for a new Axolotl release, replace the body
# below with the current upstream reference, keep this header, then run:
#
#     python -m heulistic_axolotl.generate
#
# The blank line below is load-bearing: without it this header would be read
# as the doc comment for the first field.

# Allow overwrite yml config using from cli
strict: bool | None = False
# Resume from a specific checkpoint dir
resume_from_checkpoint: str | None
# If resume_from_checkpoint isn't set and you simply want it to start where it left off.
# Be careful with this being turned on between different models.
auto_resume_from_checkpoints: bool | None
# Resize the model embeddings when new tokens are added to multiples of 32. This is
# reported to improve training speed on some models
resize_token_embeddings_to_32x: bool | None
mean_resizing_embeddings: bool | None = False

# Whether to shrink the embeddings to len(tokenizer). By default, we won't shrink.
shrink_embeddings: bool | None
# Don't upcast the embeddings to float32 when using PEFT. Useful for low-VRAM GPUs
embeddings_skip_upcast: bool | None
# Reinitialize model weights randomly instead of loading pretrained weights
reinit_weights: bool | None

# module to custom trainer class to use for training
trainer_cls: str | None

# Use RL training: 'dpo', 'ipo', 'kto', 'simpo', 'orpo', 'grpo', 'ebft'
rl: RLType | None

trl: TRLConfig | None
  # For TRLConfig:
  # Beta parameter for the RL training. Same as `rl_beta`. Use
  beta: float | None
  # Maximum length of the completion for RL training.
  max_completion_length: int | None

  # Whether to use VLLM for RL training.
  use_vllm: bool = False
  # VLLM mode to use, one of 'server' or 'colocate'
  vllm_mode: Literal['server', 'colocate'] | None
  # Host of the vLLM server to connect to.
  vllm_server_host: str | None = 0.0.0.0
  # Port of the vLLM server to connect to.
  vllm_server_port: int | None = 8000
  # Total timeout (in seconds) to wait for the vLLM server to respond.
  vllm_server_timeout: int | None
  # Regex for vLLM guided decoding.
  vllm_guided_decoding_regex: str | None

  # List of reward functions to load. Paths must be importable from current dir.
  reward_funcs: list[str] | None
  # List of reward weights for the reward functions.
  reward_weights: list[float] | None
  # Batch size for generation. Controls how many unique prompts are generated per step.
  # Should be num_generations * data_parallel_size for full DP utilization.
  generation_batch_size: int | None
  # Number of generations to sample.
  num_generations: int | None
  # Whether to log completions.
  log_completions: bool | None = False
  # Number of completions to print when log_completions is True.
  num_completions_to_print: int | None
  # Controls whether importance sampling ratios are computed at the `'token'` or
  # `'sequence'` level. For GSPO, use `sequence`, default is None which corresponds to
  # the original GRPO paper.
  importance_sampling_level: Literal['sequence', 'token'] | None

  # Whether to sync the reference model.
  sync_ref_model: bool | None = False
  # Mixup alpha for the reference model.
  ref_model_mixup_alpha: float | None = 0.9
  # Sync steps for the reference model.
  ref_model_sync_steps: int | None = 64
  # How to scale rewards by their standard deviation. One of 'group' (per prompt-group,
  # GRPO default), 'batch' (whole batch), or 'none'. Booleans are accepted for back-
  # compat (True->'group', False->'none').
  scale_rewards: bool | Literal['group', 'batch', 'none'] = True

  # Sampling temperature for the GRPO policy.
  temperature: float | None
  # Top-p sampling probability for the generation policy.
  top_p: float | None
  # Top-k sampling for the generation policy.
  top_k: int | None
  # Minimum probability for the generation policy.
  min_p: float | None
  # Penalty for tokens that appear in prompt and generated text.
  repetition_penalty: float | None
  # Additional generation parameters passed to vLLM SamplingParams. Useful for
  # stop_token_ids, seed, frequency_penalty, etc.
  generation_kwargs: dict[str, Any] | None
  # Additional kwargs for the chat template. E.g., {enable_thinking: false} for Qwen3.5
  # models.
  chat_template_kwargs: dict[str, Any] | None
  # Number of iterations per batch (μ) for GRPO.
  num_iterations: int | None
  # Epsilon value for clipping in the GRPO algorithm.
  epsilon: float | None
  # Upper-bound epsilon value for clipping in the GRPO algorithm.
  epsilon_high: float | None
  # Whether to use Liger loss for GRPO.
  use_liger_loss: bool | None
  # Loss formulation to use. Supported values: grpo, bnpo, dr_grpo.
  loss_type: str | None
  # Whether to exclude truncated completions from loss calculation.
  mask_truncated_completions: bool = False

  # Static entropy regularization coefficient for GRPO, adding an entropy bonus to
  # encourage exploration.
  entropy_coef: float | None
  # Enable adaptive entropy regularization (Skywork-OR1 style), adjusting entropy_coef
  # toward entropy_target.
  use_adaptive_entropy: bool | None
  # Target entropy when use_adaptive_entropy is enabled.
  entropy_target: float | None
  # Step size for adjusting entropy_coef toward entropy_target.
  entropy_coef_delta: float | None
  # Lower bound for the adaptive entropy_coef.
  entropy_coef_min: float | None
  # Upper bound for the adaptive entropy_coef.
  entropy_coef_max: float | None

  # Lower clip bound for the vLLM/training importance-sampling ratio.
  vllm_importance_sampling_clip_min: float | None
  # Upper clip bound for the vLLM/training importance-sampling ratio.
  vllm_importance_sampling_clip_max: float | None

  # Whether to log multimodal content (images, videos) alongside completions. Disable to
  # reduce log size.
  log_multimodal: bool | None

  # Enable sleep mode for vLLM to offload VRAM when idle
  vllm_enable_sleep_mode: bool | None
  # Path to custom rollout function. Must be importable from current dir.
  rollout_func: str | None
  # Multi-objective reward aggregation strategy. 'sum_then_normalize' (GRPO default):
  # weights and sums rewards first, then normalizes. 'normalize_then_sum' (GDPO):
  # normalizes each reward independently, then sums.
  multi_objective_aggregation: Literal['sum_then_normalize', 'normalize_then_sum'] | None

  # Use the GRPODataProducer protocol for online data generation.
  use_data_producer: bool = False
  # Generate rollouts in a background thread while training on the previous rollout.
  async_prefetch: bool = False
  # Number of rollouts to prefetch ahead of training.
  prefetch_depth: int | None
  # Sync model weights to vLLM every N optimizer steps (async mode only).
  vllm_sync_interval: int | None
  # Score prompt groups incrementally instead of the full batch at once.
  streaming_partial_batch: bool | None
  # Minimum prompt groups to score per streaming chunk.
  streaming_min_groups: int | None
  # Apply IS correction for distribution mismatch between vLLM and training model.
  vllm_importance_sampling_correction: bool | None
  # IS mode: token_truncate, token_mask, sequence_truncate, or sequence_mask.
  vllm_importance_sampling_mode: Literal['token_truncate', 'token_mask', 'sequence_truncate', 'sequence_mask'] | None
  # Cap C for IS ratio clipping/masking.
  vllm_importance_sampling_cap: float | None
  # KL threshold for off-policy sequence masking (OPSM). None = disabled.
  off_policy_mask_threshold: float | None
  # Apply IS correction to KL divergence term.
  use_bias_correction_kl: bool | None

  # Number of persistent subprocess workers for parallel reward computation. Each worker
  # has its own main thread so signal.alarm() (used by math_verify) works correctly.
  # Work is sharded across workers by prompt groups. Only used with
  # use_data_producer=True and non-nn.Module reward functions.
  reward_num_workers: int = 1
  # [Experimental, disabled by default] Size of the replay buffer for storing high-
  # signal rollout groups. When > 0, groups with reward variance are cached and used to
  # replace zero-signal groups (where all rewards are identical). Set to 0 to disable.
  # Only used with use_data_producer=True.
  replay_buffer_size: int = 0
  # When True (default), recompute old_per_token_logps for replayed groups using the
  # current training model. This fixes the importance sampling mismatch that occurs when
  # replaying stale data. Only relevant when replay_buffer_size > 0.
  replay_recompute_logps: bool = True
  # Fraction of total training steps after which deferred re-rolling begins. Zero-signal
  # prompts (where all rewards in a group are identical) are buffered and re-injected
  # into later batches when the model is more likely to solve them. Set to 1.0 to
  # disable. Only used with use_data_producer=True.
  reroll_start_fraction: float = 1.0
  # Maximum number of prompt groups to replace with re-roll candidates per batch. Higher
  # values increase data utilization but reduce prompt diversity. Only used with
  # use_data_producer=True.
  reroll_max_groups: int = 1
  # When True, skip gradient computation for micro-batches where all advantages are zero
  # (no learning signal). This avoids the forward/backward pass entirely when no
  # learning signal is present. The step is logged with skipped_zero_adv_batches=1 for
  # monitoring.
  skip_zero_advantage_batches: bool = True
  # Sync LoRA adapter to vLLM via filesystem instead of merging + NCCL broadcast. Auto-
  # selects vllm_serve_lora serve module. Syncs only LoRA adapter weights vs full merged
  # model.
  vllm_lora_sync: bool = False

vllm: VllmConfig | None
  # For VllmConfig:
  # Device to use for VLLM
  device: str | None = auto
  # Tensor parallel size for VLLM
  tensor_parallel_size: int | None
  # Data parallel size for VLLM
  data_parallel_size: int | None
  # GPU memory utilization for VLLM
  gpu_memory_utilization: float | None = 0.9
  # Data type for VLLM
  dtype: str | None = auto
  # Maximum length of the model context for VLLM
  max_model_len: int | None
  # Enable prefix caching for VLLM
  enable_prefix_caching: bool | None
  # Host for the vLLM server to start on
  host: str | None = 0.0.0.0
  # Port of the vLLM server to start on
  port: int | None = 8000

  # Enable reasoning for VLLM
  enable_reasoning: bool | None
  # Reasoning parser for VLLM
  reasoning_parser: str | None
  # Disable CUDA graph capture in vLLM. Required for models with causal_conv1d (e.g.,
  # Qwen3.5 hybrid linear attention).
  enforce_eager: bool | None
  # Python module for vLLM serve script. Set to 'axolotl.scripts.vllm_serve_lora' for
  # native LoRA support, or leave None for default TRL serve.
  serve_module: str | None
  # vLLM worker extension class for weight synchronization. Defaults to
  # 'trl.scripts.vllm_serve.WeightSyncWorkerExtension'.
  worker_extension_cls: str | None

# Configuration for Energy-Based Fine-Tuning (EBFT)
ebft: EBFTConfig | None
  # For EBFTConfig:
  # Fractional layer depths for feature extraction (e.g., [0.25, 0.5, 0.75])
  feature_layers: list[float] = [0.25, 0.5, 0.75]
  # Embedding method: 'last_token', 'mean_pooling', 'completion_mean', or 'concat'
  embed_method: Literal['last_token', 'mean_pooling', 'completion_mean', 'concat'] = last_token
  # Apply SVD whitening to feature embeddings
  use_whitening: bool = False
  # Coefficient for alignment reward (cosine similarity with ground truth)
  alignment_coef: float = 1.0
  # Coefficient for diversity penalty (pairwise similarity between samples)
  diversity_coef: float = 1.0
  # Cross-entropy loss coefficient on ground-truth tokens
  ce_coef: float = 0.0
  # Set per-batch max_tokens based on ground-truth length
  adaptive_max_tokens: bool = True
  # Multiplier for ground-truth token count when computing adaptive max_tokens
  gt_length_multiplier: float = 1.5

  # EBFT mode: 'structured' (QA with vLLM) or 'strided' (unstructured text)
  mode: Literal['structured', 'strided'] = structured
  # Stride between anchor points (tokens)
  stride: int = 8
  # Context window size per block
  context_length: int = 8
  # Tokens to generate per block
  generate_max_len: int = 8
  # Independent rollouts per document
  n_samples_per_prompt: int = 4
  # Sampling temperature for strided generation
  temperature: float = 0.6
  # Top-p nucleus sampling threshold
  top_p: float = 1.0
  # RL policy gradient loss coefficient
  rl_coef: float = 1.0
  # Advantage estimator: 'rloo', 'group_norm', 'reinforce'
  advantage_estimator: Literal['rloo', 'group_norm', 'reinforce'] = rloo
  # Minimum tokens into completion before placing anchors. Skips anchors too close to
  # the prompt boundary where features are dominated by prompt context.
  min_completion_prefix: int = 0

qat: QATConfig | None
  # For QATConfig:
  # Fake quantization layout to use for activation quantization.
  activation_dtype: TorchAOQuantDType | None
  # Fake quantization layout to use for weight quantization.
  weight_dtype: TorchAOQuantDType = TorchAOQuantDType.int8
  # Quantize embedding
  quantize_embedding: bool | None = False
  # The number of elements in each group for per-group fake quantization
  group_size: int | None = 32
  # The number of steps to apply fake quantization after
  fake_quant_after_n_steps: int | None

quantization: PTQConfig | None
  # For PTQConfig:
  # Fake quantization layout to use for weight quantization.
  weight_dtype: TorchAOQuantDType = TorchAOQuantDType.int8
  # Fake quantization layout to use for activation quantization.
  activation_dtype: TorchAOQuantDType | None
  # Whether to quantize the embedding layer.
  quantize_embedding: bool | None
  # The number of elements in each group for per-group fake quantization
  group_size: int | None = 32

# Reward modelling: `True` or `False`
reward_model: bool | None

# Configuration for dynamic checkpointing (trigger by file or signal). Set 'enabled:
# true' to activate this feature.
dynamic_checkpoint: DynamicCheckpointConfig | None
  # For DynamicCheckpointConfig:
  # Enable dynamic checkpoint triggering during training. Create a file
  # 'axolotl_checkpoint.save' in the configured `output_dir` to trigger.
  enabled: bool = False
  # Check for trigger file every N steps (reduces I/O overhead). Default: 100
  check_interval: int = 10
  # Custom trigger filename (optional). If not specified, defaults to
  # 'axolotl_checkpoint.save'. Specify a filename (not a full path) to override the
  # default.
  trigger_file_path: str = 

# Process reward modelling: `True` or `False`
process_reward_model: bool | None
# Coefficient to incentivize the reward model to output mean-zero rewards (proposed by
# https://huggingface.co/papers/2312.09244, Eq. 2). Recommended value: `0.01`.
center_rewards_coefficient: float | None
num_labels: int | None

# Whether to perform weighting in DPO trainer
dpo_use_weighting: bool | None
dpo_label_smoothing: float | None
# Precompute reference model log probabilities for DPO
precompute_ref_log_probs: bool | None

# Whether to use Liger kernel for DPO loss.
dpo_use_liger_kernel: bool | None

dpo_padding_free: bool | None

# List of DPO losses to use.
dpo_loss_type: Annotated[list[str], MinLen(1)] | None

# Weights for each DPO loss.
dpo_loss_weights: Annotated[list[float], MinLen(1)] | None

# A list of one or more datasets to finetune the model with
datasets: Annotated[list[SFTDataset | DPODataset | KTODataset | StepwiseSupervisedDataset | SyntheticDataset], MinLen(1)] | None
  # For SFTDataset:
  # HuggingFace dataset repo | s3:// | gs:// | path to local file or directory
  path: str | None
  # name of dataset split to load from
  split: str | None
  # The type of prompt to use for training. [alpaca, gpteacher, oasst, reflection]
  type: str | UserDefinedPrompterType | None
    # For UserDefinedPrompterType:
    # Custom user instruction prompt
    system_prompt: str | None
    # Use {system} as key to be replaced
    system_format: str | None
    field_system: str | None
    field_instruction: str | None
    field_input: str | None
    field_output: str | None

    # Customizable to be single line or multi-line. Use {instruction}/{input} as key to
    # be replaced. 'format' can include {input}
    format: str | None
    # 'no_input_format' cannot include {input}
    no_input_format: str | None
  input_transform: str | None
  # split dataset into N pieces (use with shards_idx)
  shards: int | None
  # the index of sharded dataset to use
  shards_idx: int | None
  # process dataset in N sequential chunks for memory efficiency (exclusive with
  # `shards`)
  preprocess_shards: int | None
  conversation: str | None

  # The name of the chat template to use for training, following values are supported:
  # tokenizer_default: Uses the chat template that is available in the
  # tokenizer_config.json. If the chat template is not available in the tokenizer, it
  # will raise an error. This is the default.
  # alpaca/inst/chatml/gemma/cohere/llama3/phi_3/deepseek_v2/jamba: These chat templates
  # are available in the axolotl codebase at src/axolotl/utils/chat_templates.py.
  # tokenizer_default_fallback_*: where * is the name of the chat template to fallback
  # to if the tokenizer does not have a chat template else default to tokenizer. E.g.
  # tokenizer_default_fallback_chatml. jinja: Uses a custom jinja template for the chat
  # template. The custom jinja template should be provided in the chat_template_jinja
  # field.
  chat_template: ChatTemplate | str | None
  # Custom jinja chat template or path to jinja file. Used only if `chat_template:
  # jinja` or empty.
  chat_template_jinja: str | None
  # path to source data files
  data_files: str | list[str] | None
  input_format: str | None
  # name of dataset configuration to load
  name: str | None
  # defines the datatype when path is a file
  ds_type: str | None
  # For `completion` datasets only, uses the provided field instead of `text` column
  field: str | None
  field_human: str | None
  field_model: str | None
  # Key containing the messages (default: "messages")
  field_messages: str | None
  # Key containing the tools (default: "tools"). Must be a list[dict] and follow [JSON
  # schema](https://json-schema.org/learn/getting-started-step-by-step).
  field_tools: str | None
  # Key containing the reasoning trace (default: "reasoning_content").
  field_thinking: str | None
  # The key the chat template expects that indicates the reasoning trace.
  template_thinking_key: str | None

  message_field_role: str | None

  message_field_content: str | None
  # Mapping of properties from the input dataset to the chat template. (default:
  # message_property_mappings={'role':'role', 'content':'content'}) If a property exists
  # in the template but not in this mapping, the system will attempt to load it directly
  # from the message using the property name as the key. Example: In the mapping below,
  # 'from' is loaded from input dataset and used as 'role', while 'value' is loaded and
  # used as 'content' in the chat template.
  message_property_mappings: dict[str, str] | None
  # The key in the message turn that indicates via boolean whether tokens of a turn
  # should be considered for training. Useful to selectively train on certain turns
  # besides the `roles_to_train`.
  message_field_training: str | None
  # The key in the message turn that contains the training details. Useful to
  # selectively train on certain tokens in a turn. The value of the key is a List[Dict]
  # containing `begin_offset` (start character index in content), `end_offset` (end
  # character index in content), and `train` (boolean whether to train).
  message_field_training_detail: str | None
  # (for Qwen3 template only) Whether to split the assistant content based on a
  # reasoning trace inside delimited tags
  split_thinking: bool | None
  logprobs_field: str | None
  temperature: float | None
  # Roles to train on. The tokens from these roles will be considered for the loss.
  roles_to_train: list[str] | None
  # Which EOS tokens to train on in the conversation. Possible values are: all: train on
  # all EOS tokens, turn (default): train on the EOS token at the end of each trainable
  # turn, last: train on the last EOS token in the conversation, none: never train on
  # EOS tokens
  train_on_eos: Literal['all', 'turn', 'last', 'none'] | None
  # Which EOT (end-of-turn) tokens to train on. Same values as train_on_eos. Defaults to
  # the train_on_eos setting when unset.
  train_on_eot: Literal['all', 'turn', 'last', 'none'] | None
  # Roles mapping in the messages. The format is {target_role: [source_roles]}. All
  # source roles will be mapped to the target role. The default is: user: ["human",
  # "user"], assistant: ["gpt", "assistant"], system: ["system"], tool: ["tool"]
  roles: dict[str, list[str]] | None
  # Whether to drop the system turn from the dataset. Only works with chat_template.
  # This does not drop the default system message from chat_template if it exists. If
  # you wish to, we recommend using a custom jinja template with the default system
  # message removed or adding a system turn with empty content.
  drop_system_message: bool | None
  # Trust remote code for untrusted source
  trust_remote_code: bool | None = False
  # The specific revision of the dataset to use when loading from the Hugging Face Hub.
  # This can be a commit hash, tag, or branch name. If not specified, the latest version
  # will be used. This parameter is ignored for local datasets.
  revision: str | None

  # For DPODataset:
  path: str | None
  split: str | None
  type: UserDefinedDPOType | str | None
    # For UserDefinedDPOType:
    field_system: str | None
    field_prompt: str | None
    field_chosen: str | None
    field_rejected: str | None
    prompt_format: str | None
    chosen_format: str | None
    rejected_format: str | None
  data_files: list[str] | None
  revision: str | None
  field_messages: str | None
  field_chosen: str | None
  field_rejected: str | None

  # For KTODataset:
  path: str | None
  split: str | None
  type: UserDefinedKTOType | str | None
    # For UserDefinedKTOType:
    field_system: str | None
    field_prompt: str | None
    field_completion: str | None
    field_label: str | None
    prompt_format: str | None
    completion_format: str | None
  data_files: list[str] | None
  trust_remote_code: bool | None = False
  revision: str | None

  # For StepwiseSupervisedDataset:
  path: str | None
  split: str | None
  data_files: list[str] | None
  revision: str | None
  step_separator: str | None
  max_completion_length: int | None
  train_on_last_step_only: bool | None

  # For SyntheticDataset:
  path: Literal['synthetic'] = synthetic
  type: Literal['_synthetic'] = _synthetic
  # Number of rows to generate
  length: int = 1000
  # Sequence length per row (defaults to sequence_len from config)
  sequence_length: int | None
  # Minimum token ID for generation
  min_input_id: int = 100
  # Maximum token ID for generation (defaults to tokenizer vocab_size)
  max_input_id: int | None
  # Random seed for reproducibility
  seed: int | None

# A list of one or more datasets to eval the model with. You can use either
# test_datasets, or val_set_size, but not both.
test_datasets: Annotated[list[SFTDataset | DPODataset | KTODataset | StepwiseSupervisedDataset | SyntheticDataset], MinLen(1)] | None
  # For SFTDataset:
  # HuggingFace dataset repo | s3:// | gs:// | path to local file or directory
  path: str | None
  # name of dataset split to load from
  split: str | None
  # The type of prompt to use for training. [alpaca, gpteacher, oasst, reflection]
  type: str | UserDefinedPrompterType | None
    # For UserDefinedPrompterType:
    # Custom user instruction prompt
    system_prompt: str | None
    # Use {system} as key to be replaced
    system_format: str | None
    field_system: str | None
    field_instruction: str | None
    field_input: str | None
    field_output: str | None

    # Customizable to be single line or multi-line. Use {instruction}/{input} as key to
    # be replaced. 'format' can include {input}
    format: str | None
    # 'no_input_format' cannot include {input}
    no_input_format: str | None
  input_transform: str | None
  # split dataset into N pieces (use with shards_idx)
  shards: int | None
  # the index of sharded dataset to use
  shards_idx: int | None
  # process dataset in N sequential chunks for memory efficiency (exclusive with
  # `shards`)
  preprocess_shards: int | None
  conversation: str | None

  # The name of the chat template to use for training, following values are supported:
  # tokenizer_default: Uses the chat template that is available in the
  # tokenizer_config.json. If the chat template is not available in the tokenizer, it
  # will raise an error. This is the default.
  # alpaca/inst/chatml/gemma/cohere/llama3/phi_3/deepseek_v2/jamba: These chat templates
  # are available in the axolotl codebase at src/axolotl/utils/chat_templates.py.
  # tokenizer_default_fallback_*: where * is the name of the chat template to fallback
  # to if the tokenizer does not have a chat template else default to tokenizer. E.g.
  # tokenizer_default_fallback_chatml. jinja: Uses a custom jinja template for the chat
  # template. The custom jinja template should be provided in the chat_template_jinja
  # field.
  chat_template: ChatTemplate | str | None
  # Custom jinja chat template or path to jinja file. Used only if `chat_template:
  # jinja` or empty.
  chat_template_jinja: str | None
  # path to source data files
  data_files: str | list[str] | None
  input_format: str | None
