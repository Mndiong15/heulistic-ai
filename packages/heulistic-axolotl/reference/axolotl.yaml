# safe via torch.library.triton_op — traces under torch.compile(fullgraph=True). Per-
# step wins are arch-dependent: ~+7-12% across sm_86 and sm_120. Combining with
# torch_compile=true is a clear win on sm_120 (+9% extra) but currently regresses on
